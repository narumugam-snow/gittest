stages:
  - validate
  - plan
  - deploy

variables:
  SNOWFLAKE_ACCOUNT: $SNOWFLAKE_ACCOUNT
  SNOWFLAKE_USER: $SNOWFLAKE_USER
  SNOWFLAKE_PASSWORD: $SNOWFLAKE_PASSWORD
  SNOWFLAKE_ROLE: $SNOWFLAKE_ROLE
  SNOWFLAKE_WAREHOUSE: $SNOWFLAKE_WAREHOUSE
  SNOWFLAKE_DATABASE: "ANALYTICS_DEV"

.snowflake_setup: &snowflake_setup
  before_script:
    - pip install snowflake-cli-labs
    - mkdir -p ~/.snowflake
    - |
      cat > ~/.snowflake/connections.toml << EOF
      [default]
      account = "$SNOWFLAKE_ACCOUNT"
      user = "$SNOWFLAKE_USER"
      password = "$SNOWFLAKE_PASSWORD"
      role = "$SNOWFLAKE_ROLE"
      warehouse = "$SNOWFLAKE_WAREHOUSE"
      database = "$SNOWFLAKE_DATABASE"
      EOF

# Validate on merge requests
validate:
  stage: validate
  image: python:3.11-slim
  <<: *snowflake_setup
  script:
    - echo "Validating SQL definitions..."
    - |
      for file in definitions/*.sql; do
        echo "Checking $file"
        snow sql -q "SELECT 1" || exit 1
      done
    - echo "Validation complete"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - definitions/**/*
        - manifest.yml

# Plan changes (dry run)
plan:
  stage: plan
  image: python:3.11-slim
  <<: *snowflake_setup
  script:
    - echo "Planning deployment..."
    - |
      echo "## Changes to be deployed:" > plan_output.md
      for file in definitions/*.sql; do
        echo "### $file" >> plan_output.md
        cat "$file" >> plan_output.md
        echo "" >> plan_output.md
      done
    - cat plan_output.md
  artifacts:
    paths:
      - plan_output.md
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - definitions/**/*
        - manifest.yml

# Deploy to Snowflake (main branch only)
deploy:
  stage: deploy
  image: python:3.11-slim
  <<: *snowflake_setup
  script:
    - echo "Deploying to Snowflake..."
    - |
      # Deploy tables
      echo "Creating/updating tables..."
      snow sql -f definitions/tables.sql --database $SNOWFLAKE_DATABASE || true
      
      # Deploy dynamic tables
      echo "Creating/updating dynamic tables..."
      snow sql -f definitions/dynamic_tables.sql --database $SNOWFLAKE_DATABASE || true
      
      # Refresh dynamic tables
      echo "Refreshing dynamic tables..."
      snow sql -q "ALTER DYNAMIC TABLE ANALYTICS_DEV.STAGING.CUSTOMERS_CLEAN REFRESH" || true
      snow sql -q "ALTER DYNAMIC TABLE ANALYTICS_DEV.MARTS.CUSTOMER_ORDERS_SUMMARY REFRESH" || true
    - echo "Deployment complete!"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - definitions/**/*
        - manifest.yml
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# Manual deploy for any branch
deploy_manual:
  stage: deploy
  image: python:3.11-slim
  <<: *snowflake_setup
  script:
    - echo "Manual deployment to Snowflake..."
    - snow sql -f definitions/tables.sql --database $SNOWFLAKE_DATABASE || true
    - snow sql -f definitions/dynamic_tables.sql --database $SNOWFLAKE_DATABASE || true
    - echo "Manual deployment complete!"
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH
